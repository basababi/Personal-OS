# CI: push/PR бүрд typecheck + tests + build.
# v* tag push хийхэд NSIS installer-ийг GitHub Releases рүү автоматаар гаргана.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write # release upload-д хэрэгтэй

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Package installer (verify only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: PersonalOS-Setup
          path: release/*.exe
          retention-days: 14

      - name: Release to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
